services:
  db:
    image: postgres:16-alpine
    container_name: rhcc-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: rhcc
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - rhcc-network

  mailpit:
    image: axllent/mailpit
    container_name: rhcc-mailpit
    restart: always
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Web UI
    networks:
      - rhcc-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - DATABASE_URL=${DATABASE_URL}
    container_name: rhcc-app
    restart: always
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://postgres:password@db:5432/rhcc
      - SMTP_HOST=rhcc-mailpit
      - SMTP_PORT=1025
    depends_on:
      - db
    networks:
      - rhcc-network

networks:
  rhcc-network:
    driver: bridge

volumes:
  postgres_data:
